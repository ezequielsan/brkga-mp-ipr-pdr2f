###############################################################################
# config.conf: parametros do BRKGA-MP-IPR (C++) para o PDR2F.
#
# Mesmo formato de examples/tsp/src/single_obj/config.conf.
# Os parametros evolutivos sao os do BRKGA de Torres (2026), ajustados pelo
# irace (run_brkga_batch.py, BEST_PARAMS): n_elites = 39, n_offsprings = 242,
# n_mutants = 19, bias = 0.7106. Os recursos extras (IPR, shake, reset,
# troca de elite) estao desligados, para reproduzir o BRKGA dele.
###############################################################################

################################
# BRKGA and IPR parameters
################################

# Population size (39 + 242 + 19 = 300).
population_size 300

# Elite percentage: unsigned(0.13 * 300) = 39 elites.
elite_percentage 0.13

# Mutants percentage: unsigned(0.0634 * 300) = 19 mutantes.
# (0.063 daria unsigned(18.9) = 18.)
mutants_percentage 0.0634

# Number of elite parents to mate (BRKGA padrao: 1 elite + 1 nao elite).
num_elite_parents 1

# Total number of parents to mate.
total_parents 2

# Bias function to be used to rank the parents.
# CUSTOM: a funcao DEVE ser definida no main com
#   algorithm.setBiasCustomFunction(
#       [](const unsigned r) { return r == 1 ? 0.7106 : 0.2894; });
# para que o filho herde a chave do pai elite com probabilidade 0.7106.
# ATENCAO: sem essa chamada a API usa, em silencio, o vies CONSTANT (0.5).
bias_type CUSTOM

# Number of independent populations.
num_independent_populations 1

# Number of pairs of chromosomes to be tested to path relinking.
pr_number_pairs 0

# Mininum distance between chromosomes to path-relink.
pr_minimum_distance 0.15

# Path relink type (DIRECT, PERMUTATION).
# DIRECT: adequado a representacoes por limiares, como a de Torres (2026).
pr_type DIRECT

# Individual selection to path-relink (BESTSOLUTION, RANDOMELITE).
pr_selection BESTSOLUTION

# Specifies the distance function between two chromosomes during IPR
# (HAMMING, KENDALLTAU, CUSTOM).
# CUSTOM: o HAMMING da API binariza as chaves com limiar 0.5 e nao distingue
# os 4 rotulos; quando o IPR for ligado, sera fornecida uma distancia propria.
pr_distance_function_type CUSTOM

# Defines the block size based on the size of the population.
alpha_block_size 1.0

# Percentage/path size.
pr_percentage 1.0

# Number of elite chromosomes exchanged from each population.
num_exchange_individuals 1

# Type of the shaking procedure (CHANGE, SWAP, CUSTOM).
# CHANGE: adequado a representacoes por limiares.
shaking_type CHANGE

# Shaking intensity lower bound.
shaking_intensity_lower_bound 0.25

# Shaking intensity upper bound.
shaking_intensity_upper_bound 0.75

################################
# Control parameters
################################

# Maximum running time in seconds.
maximum_running_time 600

# Interval / number of interations without improvement in the best solution
# at which elite chromosomes are exchanged (0 means no exchange).
exchange_interval 0

# Interval / number of interations without improvement in the best solution
# at which the Implicit Path Relink is called (0 means no IPR).
ipr_interval 0

# Interval / number of interations without improvement in the best solution
# at which the populations are shaken (0 means no shake).
shake_interval 0

# Interval / number of interations without improvement in the best solution
# at which the populations are reset (0 means no reset).
reset_interval 0

# Defines the numbers iterations to stop when the best solution is not
# improved, i.e., the algorithm converged (0 means don't stop by stall).
stall_offset 0