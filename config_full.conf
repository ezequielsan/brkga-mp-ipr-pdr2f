###############################################################################
# config_full.conf: parametros do BRKGA-MP-IPR (C++) para o PDR2F, com TODOS
# os recursos ligados: IPR, shake, reset, troca de elite (migracao) e
# multiplas populacoes (island model).
#
# Os parametros evolutivos continuam os de Torres (2026), ajustados pelo irace,
# para que a comparacao isole o efeito dos recursos extras. Os intervalos dos
# recursos sao PROPOSTAS iniciais, ainda nao calibradas.
#
# Uso:  ./main_minimal <semente> config_full.conf <tempo-max-s> <instancia> [<geracoes>]
###############################################################################

################################
# BRKGA and IPR parameters
################################

# Population size: agora e' o tamanho DE CADA populacao. Com 3 populacoes,
# sao 900 decodificacoes por geracao (3x o custo do config.conf).
population_size 300

# Elite percentage: unsigned(0.13 * 300) = 39 elites por populacao.
elite_percentage 0.13

# Mutants percentage: unsigned(0.0634 * 300) = 19 mutantes por populacao.
mutants_percentage 0.0634

# Number of elite parents to mate (BRKGA padrao: 1 elite + 1 nao elite).
num_elite_parents 1

# Total number of parents to mate.
total_parents 2

# Bias function to be used to rank the parents.
# CUSTOM: a funcao DEVE ser definida no main com setBiasCustomFunction
# (r == 1 ? 0.7106 : 0.2894). Sem isso, a API usa o vies CONSTANT (0.5).
bias_type CUSTOM

# Number of independent populations (ISLAND MODEL).
# 3 ilhas evoluem em paralelo e trocam individuos a cada exchange_interval.
num_independent_populations 3

################################
# Implicit Path Relinking (IPR)
################################

# Number of pairs of chromosomes to be tested to path relinking.
# 0 = a API testa ate' encontrar um par com distancia suficiente.
pr_number_pairs 0

# Mininum distance between chromosomes to path-relink.
# ATENCAO: com a nossa distancia, este valor e' um numero ABSOLUTO de vertices
# com rotulos diferentes (nao uma fracao). 3 = os dois cromossomos devem
# diferir em pelo menos 3 vertices.
pr_minimum_distance 3

# Path relink type (DIRECT, PERMUTATION).
# DIRECT: correto para representacoes por limiares, como a de Torres (2026).
pr_type DIRECT

# Individual selection to path-relink (BESTSOLUTION, RANDOMELITE).
pr_selection BESTSOLUTION

# Specifies the distance function between two chromosomes during IPR
# (HAMMING, KENDALLTAU, CUSTOM).
# CUSTOM: usamos a classe PDR2F_Distance (Hamming sobre os 4 rotulos).
# O HAMMING da API binariza com limiar 0.5 e confundiria {0,1} com {2,3}.
pr_distance_function_type CUSTOM

# Defines the block size based on the size of the population.
# O tamanho do bloco e' ceil(alpha_block_size * sqrt(population_size)):
# com 300, da' 18 chaves por bloco.
alpha_block_size 1.0

# Percentage/path size: 1.0 = percorre o caminho inteiro entre as solucoes.
pr_percentage 1.0

################################
# Migration and shaking
################################

# Number of elite chromosomes exchanged from each population.
num_exchange_individuals 2

# Type of the shaking procedure (CHANGE, SWAP, CUSTOM).
# CHANGE: altera os valores das chaves, correto para limiares.
# (SWAP troca chaves de posicao e serve a representacoes por permutacao.)
shaking_type CHANGE

# Shaking intensity lower bound (fracao do tamanho do cromossomo).
shaking_intensity_lower_bound 0.10

# Shaking intensity upper bound.
shaking_intensity_upper_bound 0.30

################################
# Control parameters
#
# Todos os intervalos contam GERACOES SEM MELHORA na melhor solucao, e nao
# geracoes totais. A ordem dentro de uma iteracao e': IPR, troca de elite,
# shake e reset.
################################

# Maximum running time in seconds (o main pode sobrescrever pela linha de
# comando).
maximum_running_time 600

# Interval at which elite chromosomes are exchanged (0 = no exchange).
exchange_interval 50

# Interval at which the Implicit Path Relink is called (0 = no IPR).
ipr_interval 100

# Interval at which the populations are shaken (0 = no shake).
shake_interval 200

# Interval at which the populations are reset (0 = no reset).
# O reset descarta TUDO, inclusive a elite; a melhor solucao sobrevive apenas
# no AlgorithmStatus devolvido por run().
reset_interval 500

# Numbers of iterations without improvement to stop (0 = don't stop by stall).
stall_offset 0